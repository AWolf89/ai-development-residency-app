# CI: quality gates that run on every push and pull request.
# Flow: get code (full history) -> set up Node -> install from lockfile -> lint ->
#       format check -> build (compiles + type-checks) -> dependency scan (production
#       deps, fails on any vulnerability) -> ADR checks (structure + architecture rules)
#       -> secret scan (gitleaks, full history, fails on any finding) -> accessibility
#       (contrast check + axe/keyboard scans, WCAG 2.2 AA, public pages).
#
# We build with `next build` rather than a bare `tsc --noEmit`: Next.js 16
# generates route types (e.g. LayoutProps/PageProps) into .next/types during the
# build, and `next build` type-checks against them. A standalone tsc on a clean
# checkout has no generated types and fails.
#
# NOTE: the automated-test + 80% coverage gate is intentionally deferred (see
# docs/adr/0005 and CLAUDE.md). When app logic lands (Weeks 4+), add a
# "Tests with coverage" step running `npm run test:coverage` with an 80% floor
# configured in the test tool, and require it on main.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read # read-only: CI never needs to write to the repo

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Playwright install + a11y scan add a few minutes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so the gitleaks secret scan can check every commit

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (exact versions from lockfile)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Build (compile + type-check)
        run: npm run build

      - name: Dependency scan (production deps; fails on any vulnerability)
        run: npm audit --omit=dev --audit-level=low

      - name: ADR checks (structure + architecture rules from accepted ADRs)
        # Runner's built-in python3; the scripts are standard-library only.
        run: |
          python3 tools/adr/check_adr.py --dir docs/adr
          python3 tools/adr/check_adr_rules.py --dir docs/adr --root .

      - name: Secret scan (gitleaks, full history; fails on any finding)
        # Pinned gitleaks release binary; scans all commits (fetch-depth 0 above).
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact .

      - name: Accessibility — contrast check (WCAG 2.2 AA color pairs)
        run: python3 tools/a11y/check_contrast.py a11y-contrast.json

      - name: Accessibility — install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility — axe + keyboard scans (public pages)
        # Builds and serves the app, then checks each public page with axe-core.
        run: npm run test:a11y
