# CI: quality gates that run on every push and pull request.
# Flow: get code -> set up Node -> install from lockfile -> lint -> format check
#       -> type-check -> dependency scan (production deps, fails on any vulnerability).
#
# NOTE: the automated-test + 80% coverage gate is intentionally deferred (see
# docs/adr/0005 and CLAUDE.md). When app logic lands (Weeks 4+), add a
# "Tests with coverage" step running `npm run test:coverage` with an 80% floor
# configured in the test tool, and require it on main.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read # read-only: CI never needs to write to the repo

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (exact versions from lockfile)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Type-check (tsc --noEmit)
        run: npm run type-check

      - name: Dependency scan (production deps; fails on any vulnerability)
        run: npm audit --omit=dev --audit-level=low
