# Answer-quality evals for the career chatbot (ai-evals skill).
# The agent reasoning suite (the four FSM agents' §13 golden set) is a sibling config,
# promptfooconfig.agents.yaml — promptfoo is one provider-suite per file — run with `npm run eval:agents`.
description: Career chatbot answer quality
prompts:
  - "{{question}}"
providers:
  - id: file://evals/chat/provider.mjs
    label: career-chat-app
defaultTest:
  options:
    # Judge: a different model family than the chatbot, called through OpenRouter with privacy routing.
    provider:
      id: openai:chat:google/gemini-2.5-flash
      config:
        apiBaseUrl: "{{env.OPENROUTER_BASE_URL}}"
        apiKey: "{{env.OPENROUTER_API_KEY}}"
        temperature: 0
        passthrough:
          provider: { data_collection: deny, zdr: true }
tests: file://evals/chat/tests.generated.json
evaluateOptions:
  maxConcurrency: 2
